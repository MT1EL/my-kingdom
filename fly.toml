# ------------------------------------------------------------------
# The API on Fly.io. Uses the Dockerfile at the repository root.
#
#   fly launch --no-deploy      # creates the app; keep this file
#   fly volumes create mykingdom_data --size 1 --region fra
#   fly secrets set SESSION_SECRET=... ADMIN_EMAIL=... ADMIN_PASSWORD=... CORS_ORIGINS=...
#   fly deploy
#
# The volume is what makes the database and the photos survive a deploy.
# ------------------------------------------------------------------

app = "mykingdom-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATABASE_URL = "file:/var/data/mykingdom.db"
  UPLOAD_DIR = "/var/data/uploads"

[[mounts]]
  source = "mykingdom_data"
  destination = "/var/data"

[http_service]
  internal_port = 4000
  force_https = true
  # SQLite is a single file with one writer — keep it to one machine.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
