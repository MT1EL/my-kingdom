# ------------------------------------------------------------------
# Netlify build for the public site (the `src/` app).
#
# Netlify serves static files. It does NOT run `server/` — that is a
# long-running Node process and needs its own host. Until the API has a
# public URL, `/api/*` has nothing to answer it and the site shows its
# "საიტი ვერ ჩაიტვირთა" screen.
# ------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site is a single-page app: React Router owns /menu, /programs and the
# rest. Without this, a direct visit or a refresh on any path but "/" asks
# Netlify for a file that does not exist and gets a 404.
#
# It must stay the LAST rule — it matches everything, so any /api proxy has
# to be declared above it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------
# Once the API is deployed, uncomment this and put its host in. It proxies
# /api and /uploads to the API from the site's own domain, which keeps the
# browser on one origin — no CORS, and relative image paths keep working.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/uploads/*"
#   to = "https://YOUR-API-HOST/uploads/:splat"
#   status = 200
#   force = true
# ------------------------------------------------------------------
