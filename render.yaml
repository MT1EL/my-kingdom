# ------------------------------------------------------------------
# Everything on Render, free tier.
#
#   mykingdom-db     Postgres          — content, bookings, and the photos
#   mykingdom-api    Web Service       — the API, and the dashboard at /admin
#   mykingdom-site   Static Site       — the public site
#
# Render reads this file from: New → Blueprint.
#
# Two consequences of the free tier, both covered in DEPLOYMENT.md:
#   · the web service sleeps when idle, so the first request after a quiet
#     spell waits for it to wake;
#   · free Postgres instances have an expiry — check Render's current terms,
#     because losing it means losing every booking.
# ------------------------------------------------------------------

databases:
  - name: mykingdom-db
    plan: free
    region: frankfurt
    databaseName: mykingdom
    user: mykingdom

services:
  # ---------------------------- the API ----------------------------
  - type: web
    name: mykingdom-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    # --include=dev is required: NODE_ENV=production makes npm skip
    # devDependencies, and TypeScript is one of them.
    # The dashboard is built here too, because this service serves it.
    buildCommand: >-
      npm --prefix admin install --include=dev &&
      ADMIN_BASE=/admin/ npm --prefix admin run build &&
      npm --prefix server install --include=dev &&
      npm --prefix server run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: mykingdom-db
          property: connectionString

      # Render's free tier has no disk and no object storage, so the photos
      # live in Postgres and are served from /uploads.
      - key: STORAGE_DRIVER
        value: database

      # Serve the dashboard from this same origin, at /admin. Same-origin
      # keeps its login cookie first-party, which no browser privacy setting
      # will interfere with.
      #
      # Set to "false" if the dashboard is hosted separately — then it is a
      # cross-site cookie, which needs NODE_ENV=production (so the cookie is
      # issued SameSite=None; Secure) and the dashboard's origin listed in
      # CORS_ORIGINS.
      - key: SERVE_ADMIN
        value: "true"

      # Render generates this on first deploy; never commit a real secret.
      - key: SESSION_SECRET
        generateValue: true

      # The first admin account is created from these on boot. Set both in
      # the dashboard before deploying.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- email --------------------------------------------------
      # Booking notifications: one to the venue, one to the family.
      # Leave EMAIL_DRIVER as "none" and nothing is sent — the API logs a
      # warning at boot to that effect.
      - key: EMAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # Must be on a domain verified with Resend, or its sandbox sender.
      - key: EMAIL_FROM
        sync: false
      # Where new requests are read. Falls back to the dashboard's contact
      # email if left unset.
      - key: EMAIL_VENUE_TO
        sync: false
      # Where the "open in the dashboard" button in the venue's email
      # points. Set this when the dashboard is hosted separately (e.g. on
      # Netlify); left unset, it falls back to this service's own
      # RENDER_EXTERNAL_URL + /admin.
      - key: DASHBOARD_URL
        sync: false

      # The public site's origin. The dashboard is same-origin so it needs
      # no entry here.
      - key: CORS_ORIGINS
        fromService:
          name: mykingdom-site
          type: web
          property: hostport

  # -------------------------- the site -----------------------------
  - type: web
    name: mykingdom-site
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    envVars:
      # Baked into the bundle at build time: the site calls the API directly.
      # No cookies are involved on the public site, so plain CORS is enough.
      - key: VITE_API_URL
        fromService:
          name: mykingdom-api
          type: web
          property: host

    routes:
      # React Router owns /menu, /programs and the rest. Without this a
      # refresh on any path but "/" would 404.
      - type: rewrite
        source: /*
        destination: /index.html
